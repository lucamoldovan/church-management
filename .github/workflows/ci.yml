name: Local platform CI

on:
  push:
    branches: [local-operations-platform]
  pull_request:
    branches: [local-operations-platform]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build dashboard and API
        run: npm run build
      - name: Run API tests
        run: npm test
