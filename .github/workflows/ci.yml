name: CI

on:
  push:
    branches:
      - cloudflare-d1-migration
      - stage-**
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate D1 migrations
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          for path in (Path('migrations/0001_cloudflare_native.sql'), Path('migrations/0002_security_hardening.sql')):
              db.executescript(path.read_text())
          print('D1 migrations validated successfully')
          PY

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

      - name: OpenNext Cloudflare build
        run: npm run build:cf
