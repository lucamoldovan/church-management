# Copy the CHURCH_DB binding into wrangler.toml after creating the D1 database.
# Cloudflare can also add this binding from Workers > Settings > Bindings.

[[d1_databases]]
binding = "CHURCH_DB"
database_name = "church-management"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

