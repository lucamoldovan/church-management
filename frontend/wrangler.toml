name = "church-management"
main = ".open-next/worker.js"
compatibility_date = "2026-09-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

# Required secrets are declared here so a deployment cannot silently proceed
# without the credentials required by the production readiness check.
[secrets]
required = [
  "BETTER_AUTH_SECRET",
  "STRIPE_SECRET_KEY",
  "STRIPE_WEBHOOK_SECRET",
]

# Cloudflare resource bindings are intentionally attached to the Worker in the
# Cloudflare dashboard until the deployment-specific resource IDs are known.
#
# Required runtime bindings:
#   CHURCH_DB -> D1 database
#   MEDIA     -> R2 bucket
#   EMAIL     -> Email Service send binding
#
# Do not commit account-specific database/bucket IDs here. Once the resources
# are created, bind them to this Worker from Cloudflare:
#
# [[d1_databases]]
# binding = "CHURCH_DB"
# database_name = "church-management"
# database_id = "YOUR_D1_DATABASE_ID"
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "church-management-media"
#
# [[send_email]]
# name = "EMAIL"
